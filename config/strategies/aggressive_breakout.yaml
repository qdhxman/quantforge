# YAML version needs the optional extra: pip install -e '.[yaml]'
# Otherwise use the .json strategy files -- identical schema.
name: aggressive-breakout
description: Max-combination breakout strategy for illustrating risk controls
symbols: [AAPL, MSFT, NVDA, SPY]
factors:
  - name: breakout
    weight: 1.0
    params: { channel: 20 }
  - name: atr_trend
    weight: 0.8
    params: { period: 14 }
  - name: volume_spike
    weight: 0.6
    params: { period: 20 }
signal:
  buy_threshold: 0.12
  sell_threshold: -0.12
  smoothing: 0.0
  min_holding_bars: 1
  combine_method: max          # most bullish factor wins -> aggressive
backtest:
  initial_cash: 100000.0
  commission_bps: 10.0
  slippage_bps: 8.0
  max_position_pct: 0.4
  max_gross_exposure_pct: 1.0
risk:
  max_order_notional: 40000.0
  max_position_pct: 0.4
  max_gross_exposure_pct: 1.0
  max_daily_loss_pct: 0.05
  max_drawdown_pct: 0.25
  kill_switch: false
trading:
  mode: paper
  poll_seconds: 60
